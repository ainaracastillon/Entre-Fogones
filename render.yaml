services:
  - type: web
    name: entre-fogones
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: entre-fogones-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: entre-fogones-db
    region: frankfurt
    plan: free
