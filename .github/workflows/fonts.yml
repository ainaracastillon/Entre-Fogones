name: Guardar tipografías en el repositorio
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/fonts.yml']
permissions:
  contents: write
jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Descargar tipografías (Fontsource, licencia OFL)
        run: |
          mkdir -p /tmp/f && cd /tmp/f && npm init -y >/dev/null
          npm i @fontsource-variable/bricolage-grotesque@5 @fontsource/young-serif@5 @fontsource/caveat@5 >/dev/null
          D=$GITHUB_WORKSPACE/public/fonts; mkdir -p $D
          cp node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2 $D/
          cp node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-ext-wght-normal.woff2 $D/
          cp node_modules/@fontsource/young-serif/files/young-serif-latin-400-normal.woff2 $D/
          cp node_modules/@fontsource/young-serif/files/young-serif-latin-ext-400-normal.woff2 $D/
          cp node_modules/@fontsource/caveat/files/caveat-latin-500-normal.woff2 $D/
          cp node_modules/@fontsource/caveat/files/caveat-latin-ext-500-normal.woff2 $D/
          for p in @fontsource-variable/bricolage-grotesque @fontsource/young-serif @fontsource/caveat; do n=$(basename $p); cp node_modules/$p/LICENSE $D/OFL-$n.txt 2>/dev/null || true; done
          ls -la $D
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/fonts
          git diff --cached --quiet || git commit -m "Tipografías en public/fonts"
          git push
