<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Entre Fogones</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32"><link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180"><link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-title" content="Entre Fogones"><meta name="application-name" content="Entre Fogones"><meta name="theme-color" content="#B5562B"><meta name="description" content="Guarda tus recetas en libros, compártelas y chatea con tus amigos.">
<link rel="preload" href="/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/fonts/fonts.css">
<style>
html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}

/* Layout: estantería de libros (carpetas) → libro abierto a doble página; chat y amigos como paneles laterales */
:root{
  --bg:#F6EEE6; --surface:#FFFAF5; --ink:#3B2116; --muted:#7A5C4C; --line:#E7D5C5;
  --accent:#B5562B; --accent-ink:#FFF6EE; --accent-soft:#F3E0D2;
  --paper:#FFFBF4; --paper-ink:#2E1A11; --paper-muted:#7D6150; --paper-line:#EADCCB;
  --shelf:#8A5A3B; --shelf-edge:#6E4429; --ok:#2F7D5B; --danger:#A33A2A;
  --f-ui:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --f-book:'Young Serif',Georgia,'Times New Roman',serif;
  --f-hand:'Caveat','Segoe Print','Bradley Hand',cursive;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1310; --surface:#271B16; --ink:#F3E6DA; --muted:#BFA391; --line:#3B2B23;
  --accent:#E8834F; --accent-ink:#2A140A; --accent-soft:#3A2418;
  --paper:#F1E6D6; --paper-ink:#2E1A11; --paper-muted:#6F5444; --paper-line:#D9C8B2;
  --shelf:#5E3C27; --shelf-edge:#452B1B; --ok:#6CC59A; --danger:#F08A76; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1310; --surface:#271B16; --ink:#F3E6DA; --muted:#BFA391; --line:#3B2B23;
  --accent:#E8834F; --accent-ink:#2A140A; --accent-soft:#3A2418;
  --paper:#F1E6D6; --paper-ink:#2E1A11; --paper-muted:#6F5444; --paper-line:#D9C8B2;
  --shelf:#5E3C27; --shelf-edge:#452B1B; --ok:#6CC59A; --danger:#F08A76; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;overflow-wrap:break-word;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
body>main{flex:1 0 auto}
html.modal-open,html.modal-open body{overflow:hidden;overscroll-behavior:none}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--ink)}
.brand .w{line-height:.92;text-align:left}
.brand .w1{font-weight:500;font-size:11px;letter-spacing:1px}
.brand .w2{font-weight:800;font-size:22px;letter-spacing:-.5px}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav button{background:none;border:1px solid transparent;border-radius:999px;padding:7px 14px;font-weight:500;color:var(--muted);position:relative}
.nav .login{display:inline-flex;align-items:center;gap:6px;color:var(--ink);border-color:var(--line);background:var(--surface)}
.nav .me{margin-left:4px}
.nav button[aria-current="page"]{background:var(--surface);border-color:var(--line);color:var(--ink)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;margin-left:6px;font-variant-numeric:tabular-nums}
.me{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font-size:13px}
.av{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex:none}
.av.lg{width:40px;height:40px;font-size:15px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;font-weight:500;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{background:none}
.btn.sm{padding:5px 12px;min-height:32px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.55;cursor:default}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0 0 4px}

main{padding-block:24px 64px}

/* library */
.lib-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.lib-head h1{font-size:clamp(26px,4vw,36px);font-weight:800;letter-spacing:-.5px}
.lib-actions{margin-bottom:18px}
.swipe-hint{position:fixed;top:50%;z-index:90;width:44px;height:44px;border-radius:50%;background:var(--surface,#fff);color:var(--ink,#2a1d14);box-shadow:0 4px 16px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1;pointer-events:none;transition:background .15s,color .15s}
.swipe-hint.l{left:0}.swipe-hint.r{right:0}
.swipe-hint.go{background:var(--accent);color:var(--accent-ink)}
.shelf-wrap{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 20px 0;overflow:hidden}
.shelf{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;min-height:230px;padding:0 6px}
.shelf-board{height:16px;margin:0 -20px;background:var(--shelf);border-top:4px solid var(--shelf-edge)}
.spine{--cloth:#2F5D46;position:relative;width:62px;border:0;border-radius:4px 4px 2px 2px;background:var(--cloth);color:#FBF3E8;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:14px 0 10px;transition:transform .2s ease;box-shadow:inset 6px 0 0 rgba(255,255,255,.08),inset -4px 0 0 rgba(0,0,0,.18)}
.spine::before,.spine::after{content:"";position:absolute;left:0;right:0;height:3px;background:rgba(255,235,190,.55)}
.spine::before{top:22px}.spine::after{bottom:30px}
.spine:hover{transform:translateY(-8px)}
.spine .st{display:flex;justify-content:center;align-items:center;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--f-book);font-size:16px;line-height:1.08;text-align:center;white-space:normal;overflow-wrap:normal;word-break:normal;hyphens:none;flex:1;min-height:0;width:100%;max-width:52px;overflow:hidden;margin:30px 0 8px;padding:0 5px;box-sizing:border-box}
.spine.add .st{flex:none;max-height:150px}
.spine .sc{font-size:11px;font-weight:700;background:rgba(0,0,0,.22);border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.spine.all{background:repeating-linear-gradient(90deg,var(--cloth) 0 14px,color-mix(in srgb,var(--cloth) 82%,#000) 14px 16px)}
.spine.add{background:none;border:2px dashed var(--muted);color:var(--muted);box-shadow:none;justify-content:center;gap:8px}
.spine.add::before,.spine.add::after{display:none}
.spine.add .st{margin:0}
.recent{margin-top:32px}
.recent h2{font-size:20px;font-weight:700;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.rcard{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-width:0}
.rcard:hover{border-color:var(--muted)}
.thumb{width:64px;height:64px;border-radius:8px;flex:none;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.rcard .tt{font-weight:700;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rcard .mm{font-size:13px;color:var(--muted)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;margin-bottom:18px;font-size:14px}

/* book: libro abierto que cabe entero en pantalla; el texto se ajusta a cada página */
.book-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.book-head h1{font-size:22px;font-weight:800}
.book-head .sp{flex:1}
.in-book main{padding-block:16px 10px}
.book-stage{display:flex;justify-content:center;align-items:flex-start;width:100%;min-width:0}
.book{--cloth:#2F5D46;--bp:12px;position:relative;flex:none;background:var(--cloth);border-radius:10px;padding:var(--bp);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.18),0 3px 0 rgba(0,0,0,.18),0 28px 50px -22px rgba(40,20,5,.6);perspective:2600px}
.book::after{content:"";position:absolute;top:calc(var(--bp) * .4);bottom:calc(var(--bp) * .4);left:50%;width:4px;transform:translateX(-50%);background:rgba(0,0,0,.4);border-radius:2px;pointer-events:none}
.book.single::after{display:none}
.spread{display:grid;grid-template-columns:1fr 1fr;height:100%;position:relative}
.book.single .spread{grid-template-columns:1fr}
.page{position:relative;min-width:0;min-height:0;display:flex;overflow:visible;color:var(--paper-ink);font-size:14px;line-height:1.45;cursor:zoom-in;background:var(--paper)}
.page .pc{flex:1;min-height:0;min-width:0;padding:8% 9% 10%;overflow:hidden}
.page.l{border-radius:4px 0 0 4px;background:linear-gradient(to left,rgba(60,30,10,.24),rgba(60,30,10,.07) 5%,transparent 13%),var(--paper);
  box-shadow:-2px 1px 0 -1px var(--paper-line),-3px 2px 0 -1px var(--paper),-4px 2px 0 -1px var(--paper-line),-6px 3px 0 -2px var(--paper),-7px 3px 0 -2px var(--paper-line)}
.page.r{border-radius:0 4px 4px 0;background:linear-gradient(to right,rgba(60,30,10,.24),rgba(60,30,10,.07) 5%,transparent 13%),var(--paper);
  box-shadow:2px 1px 0 -1px var(--paper-line),3px 2px 0 -1px var(--paper),4px 2px 0 -1px var(--paper-line),6px 3px 0 -2px var(--paper),7px 3px 0 -2px var(--paper-line)}
.page.solo{border-radius:4px;cursor:zoom-out;box-shadow:3px 3px 0 -1px var(--paper-line),5px 5px 0 -2px var(--paper-line)}
.page .pn{position:absolute;bottom:3.2%;font-family:var(--f-book);font-size:.8em;color:var(--paper-muted);font-variant-numeric:tabular-nums}
.page.l .pn{left:9%}.page.r .pn,.page.solo .pn{right:9%}
.page h2{font-family:var(--f-book);font-weight:400;font-size:2.05em;line-height:1.08;margin-bottom:.35em}
.page h3{font-size:.78em;letter-spacing:.16em;text-transform:uppercase;color:var(--paper-muted);font-weight:700;margin:1.3em 0 .45em}
.page .meta{display:flex;flex-wrap:wrap;gap:.3em 1em;font-size:.88em;color:var(--paper-muted);align-items:center}
.page .pimgw{margin:.9em 0 .2em;display:flex;justify-content:center}
.page .pimg{display:block;max-width:100%;max-height:12em;width:auto;height:auto;border:.35em solid #FFFDF7;box-shadow:0 1px 2px rgba(60,30,10,.25),0 .3em .9em rgba(60,30,10,.18);border-radius:2px;background:#FFFDF7}
.rr-img{display:flex;justify-content:center;margin:4px 0 14px}
.rr-img img{display:block;max-width:100%;max-height:min(420px,60vh);width:auto;height:auto;border:8px solid #FFFDF7;border-radius:4px;box-shadow:0 2px 4px rgba(60,30,10,.18),0 10px 26px rgba(60,30,10,.16)}
.ing{list-style:none;margin:0;padding:0}
.ing li{padding:.32em 0;border-bottom:1px dotted var(--paper-line)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:2em 1fr;gap:.3em;padding:.4em 0}
.steps li::before{content:counter(s);font-family:var(--f-book);font-size:1.3em;color:var(--accent);line-height:1.15}
.page strong{font-weight:700}.page em{font-style:italic}
.note{font-family:var(--f-hand);font-size:1.45em;line-height:1.2;color:#4A5D8A;margin-top:1em;transform:rotate(-1deg)}
.serv{display:inline-flex;align-items:center;gap:.2em;border:1px solid var(--paper-line);border-radius:999px;padding:.05em .25em}
.serv button{width:1.7em;height:1.7em;border-radius:50%;border:0;background:none;color:var(--paper-ink);font-weight:700;font-size:1em;padding:0}
.serv button:hover{background:var(--paper-line)}
.title-page{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:.9em;height:100%}
.title-page .orn{width:7em;height:1px;background:var(--paper-ink);opacity:.4}
.title-page h2{font-size:2.6em}
.title-page .by{font-family:var(--f-hand);font-size:1.7em;color:var(--paper-muted)}
.title-page svg{width:3em;height:auto}
.toc{list-style:none;margin:0;padding:0}
.toc button{display:flex;width:100%;gap:.4em;align-items:baseline;background:none;border:0;padding:.42em 0;text-align:left;color:var(--paper-ink);font-size:1em}
.toc button:hover .tn{color:var(--accent);text-decoration:underline}
.toc .dots{flex:1;border-bottom:1.5px dotted var(--paper-line);transform:translateY(-.25em);min-width:1.2em}
.toc .tp{font-family:var(--f-book);font-variant-numeric:tabular-nums;color:var(--paper-muted)}
.page .src{font-size:.82em;color:var(--paper-muted);margin-top:1.1em;word-break:break-all}
.page .src a{color:var(--paper-muted)}
.page .pempty{display:grid;gap:.8em;justify-items:start;color:var(--paper-muted)}
.page .pempty .btn{color:var(--paper-ink);background:var(--paper);border-color:var(--paper-line);font-size:13px}
.book-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.pager{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.pager .btn{min-width:44px;justify-content:center}
.hint{font-size:13px;color:var(--muted)}
.leaf-in-r{animation:leafR .55s cubic-bezier(.3,.7,.2,1);transform-origin:left center}
.leaf-in-l{animation:leafL .55s cubic-bezier(.3,.7,.2,1);transform-origin:right center}
@keyframes leafR{from{transform:rotateY(-80deg);filter:brightness(.8)}to{transform:none}}
@keyframes leafL{from{transform:rotateY(80deg);filter:brightness(.8)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.leaf-in-r,.leaf-in-l{animation:none}.spine{transition:none}}
/* vista ampliada */
.zoomwrap{position:fixed;inset:0;z-index:45;background:#160D08;display:flex;flex-direction:column;gap:10px;padding:max(10px,env(safe-area-inset-top,0px)) 12px max(10px,env(safe-area-inset-bottom,0px))}
.zoomwrap .book-stage{flex:1;min-height:0;align-items:center}
.zoombar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;color:#F3E6DA}
.zoombar .ttl{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zoombar .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#F3E6DA}
.zoombar .btn:hover{border-color:rgba(255,255,255,.5)}
.zoombar .muted{color:#C9B4A3}
/* ruleta de color */
.cfield{display:grid;gap:10px}
.sw.wheelbtn{background:conic-gradient(#E53935,#FDD835,#43A047,#00ACC1,#1E88E5,#8E24AA,#E53935)}
.wheelbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.wheel{position:relative;width:min(180px,60vw);aspect-ratio:1;max-width:100%}
.wheel canvas{width:100%;height:100%;display:block;border-radius:50%;touch-action:none;cursor:crosshair}
.knob{position:absolute;width:20px;height:20px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.3);transform:translate(-50%,-50%);pointer-events:none}
.wheelside{display:grid;gap:12px;min-width:160px;flex:1}
.wheelside input[type=range]{width:100%;accent-color:var(--accent)}
.cprev{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);flex:none}
/* chat de recetas con IA */
.aichat{display:flex;flex-direction:column;gap:8px;max-height:28vh;overflow:auto}
.aimsg{max-width:85%;padding:9px 13px;border-radius:14px;background:var(--bg);border:1px solid var(--line);align-self:flex-start;white-space:pre-wrap}
.aimsg.user{align-self:flex-end;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.aiform{display:flex;gap:8px;align-items:flex-end}
.aiform textarea{flex:1;resize:none}
.rprev{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:10px;padding:18px 20px;max-height:46vh;overflow:auto;font-size:14px}
.rprev .rp-col{min-width:0}
.rprev .rp-t{font-family:var(--f-book);font-size:24px;line-height:1.15}
.rprev .rp-m{color:var(--paper-muted);font-size:13px;margin:4px 0 6px}
.rprev .rp-h{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--paper-muted);font-weight:700;margin:12px 0 4px}
.rprev .rp-img{width:100%;max-height:160px;object-fit:cover;border-radius:6px;margin-top:6px}
.rprev .note{font-size:20px}
.approve{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.modal a{color:var(--accent)}
.tabs button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.legal-foot{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;padding:4px 16px 28px;font-size:13px}
.legal-foot a{color:var(--muted)}
.in-book .legal-foot{display:none}
.legal-foot .sep{width:1px;background:var(--line)}
.row.nowrap{flex-wrap:nowrap}
/* barra superior en una sola línea */
.top .wrap{flex-wrap:nowrap}
.nav{flex-wrap:nowrap;align-items:center}
.nav button{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.nav .ico{width:17px;height:17px}
.nav .short{display:none}
.tools,.composer .tools{flex-wrap:nowrap}
/* opciones de nueva receta */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.opt{display:grid;gap:4px;justify-items:start;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:108px}
.opt:hover{border-color:var(--accent)}
.opt .ico{width:24px;height:24px;color:var(--accent);margin-bottom:4px}
.opt .ot{font-weight:700;font-size:15px}
.opt .od{font-size:13px;color:var(--muted);line-height:1.35}
#tabWrap{display:grid;gap:10px}#tabWrap[hidden]{display:none}
#optBack{justify-self:start}
.opt-h{font-size:18px;font-weight:800}
@media (max-width:640px){
  .brand .w{display:none}
  .nav{gap:2px;margin-left:auto}
  .nav button{flex-direction:column;gap:2px;padding:5px 8px;font-size:11px;border-radius:12px;position:relative}
  .nav .ico{width:20px;height:20px}
  .nav .badge{position:absolute;top:0;right:2px;margin:0;min-width:16px;height:16px;font-size:10px}
  .nav .long{display:none}.nav .short{display:inline}
  .nav .login,.nav .me{border:0;background:none;padding:5px 8px}
  .nav .me .av{width:22px;height:22px;font-size:10px}
  .nav .me .nl{max-width:64px;overflow:hidden;text-overflow:ellipsis}
  .tbtn{padding:0;width:40px;min-height:40px;justify-content:center}
  .tbtn .lbl{display:none}
  .book-head{flex-wrap:nowrap}
